version: 2
updates:
  - package-ecosystem: terraform
    # Espera 7 dias antes de proponer una version nueva (mitiga paquetes comprometidos recien publicados)
    cooldown:
      default-days: 7
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    labels:
      - dependencies
    ignore:
      - dependency-name: "hashicorp/aws"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions

    # Espera 7 dias antes de proponer una version nueva (mitiga paquetes comprometidos recien publicados)

    cooldown:

      default-days: 7
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"
